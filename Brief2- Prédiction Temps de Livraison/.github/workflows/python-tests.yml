name: Run Unit Tests

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupérer le code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Installer Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3️⃣ Lister les fichiers pour debug (optionnel)
      - name: List files
        run: ls -R Brief2_Prediction_Temps_de_Livraison

      # 4️⃣ Installer les dépendances depuis requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Brief2_Prediction_Temps_de_Livraison/requirements.txt

      # 5️⃣ Exécuter les tests
      - name: Run tests
        run: pytest -v "Brief2_Prediction_Temps_de_Livraison/test_pipeline.py"
