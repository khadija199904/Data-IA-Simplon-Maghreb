name: Run Unit Tests

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Brief2_Prediction_Temps_de_Livraison/requirements.txt
          pip install pytest joblib scikit-learn pandas

      - name: Run tests
        run: pytest -v Brief2_Prediction_Temps_de_Livraison/test_pipeline.py
